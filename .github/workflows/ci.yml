name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  version-sync:
    name: Version sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CMakeLists, flake.nix and PKGBUILD versions agree
        run: |
          set -euo pipefail
          cmake_ver=$(sed -n 's/.*project(Nala VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          flake_ver=$(sed -n 's/^[[:space:]]*version = "\([0-9.]*\)";.*/\1/p' flake.nix | head -1)
          pkg_ver=$(sed -n 's/^pkgver=\(.*\)/\1/p' PKGBUILD)
          echo "CMakeLists=$cmake_ver flake=$flake_ver PKGBUILD=$pkg_ver"
          test -n "$cmake_ver"
          test "$cmake_ver" = "$flake_ver"
          test "$cmake_ver" = "$pkg_ver"
          grep -q "## ${cmake_ver} " CHANGELOG.md

  build:
    name: Nix build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build package (flake checkPhase runs the test suites)
        run: nix build -L
      - name: Smoke --version (headless)
        run: |
          set -euo pipefail
          # Belt-and-suspenders: the binary now early-exits --version and
          # auto-selects offscreen when no display is present, but CI still
          # sets the QPA platform explicitly so a regression is obvious.
          ver=$(sed -n 's/.*project(Nala VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          out=$(QT_QPA_PLATFORM=offscreen QT_QPA_PLATFORMTHEME= \
            ./result/bin/nala --version)
          echo "explicit offscreen: $out"
          test "$out" = "nala ${ver}"
          # Also prove the auto-offscreen path: no display vars, no QT_QPA.
          out2=$(env -u DISPLAY -u WAYLAND_DISPLAY -u QT_QPA_PLATFORM \
            QT_QPA_PLATFORMTHEME= ./result/bin/nala --version)
          echo "auto offscreen: $out2"
          test "$out2" = "nala ${ver}"
      - name: Smoke doctor (headless, no companion)
        run: |
          set -euo pipefail
          ver=$(sed -n 's/.*project(Nala VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          # Companion is not running on CI: oneshot diagnose must still answer.
          report=$(QT_QPA_PLATFORM=offscreen QT_QPA_PLATFORMTHEME= \
            ./result/bin/nala doctor)
          echo "$report" | head -20
          echo "$report" | head -1 | grep -qx "nala ${ver}"
